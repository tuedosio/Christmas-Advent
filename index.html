<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Christmas Advent Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f2933, #050816);
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 20px;
      padding: 20px 18px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.25);
      backdrop-filter: blur(14px);
    }

    .title {
      text-align: center;
      margin-bottom: 10px;
    }

    .title h1 {
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #facc15;
    }

    .title h2 {
      font-size: 0.9rem;
      font-weight: 400;
      margin-top: 4px;
      color: #e5e7eb;
    }

    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .day-btn {
      position: relative;
      border: none;
      border-radius: 12px;
      padding: 12px 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: #e5e7eb;
      background: linear-gradient(135deg, #0f172a, #111827);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease,
        background 0.2s ease, border-color 0.15s ease;
      border: 1px solid rgba(148, 163, 184, 0.35);
      overflow: hidden;
    }

    .day-btn span.day-number {
      position: relative;
      z-index: 2;
    }

    .day-btn.opened {
      background: linear-gradient(135deg, #065f46, #15803d);
      border-color: rgba(250, 204, 21, 0.9);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: #020617;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      padding: 18px 18px 16px;
      position: relative;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #facc15;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .modal-body {
      font-size: 0.9rem;
      color: #e5e7eb;
      line-height: 1.6;
    }

    .modal-tag {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      font-size: 0.7rem;
      margin-bottom: 8px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">
      <h1>Christmas Advent Calendar</h1>
      <h2>6–25 December</h2>
    </div>

    <p class="subtitle">Tap a date to open a festive surprise 🎄✨</p>

    <div class="calendar-grid">
      <script>
        for (let d = 6; d <= 25; d++) {
          document.write(`<button class="day-btn" data-day="${d}">
            <span class="day-number">${d}</span>
          </button>`);
        }
      </script>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Surprise</div>
        <button class="close-btn" id="close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-tag" id="tag"></div>
        <div id="content"></div>
      </div>
    </div>
  </div>

  <script>
    const data = {
      6: { tag: "Aesthetic", val: "Dark green velvet, soft fairy lights, and calm vibes ☕✨" },
      7: { tag: "Quote", val: "“Christmas magic is silent. You don't hear it — you feel it.”" },
      8: { tag: "Joke", val: "Why was the snowman rummaging in a bag of carrots? He was picking his nose! 😂" },
      9: { tag: "Fact", val: "The largest Christmas tree ever was a 221-foot Douglas fir! 🎄" },
      10: { tag: "Gift", val: "Virtual fluffy socks, no cold toes ❄️🧦" },
      11: { tag: "Aesthetic", val: "Candlelight + slow music + warm blankets = December bliss 🕯️" },
      12: { tag: "Quote", val: "“Joy is the sparkle of Christmas.” ✨" },
      13: { tag: "Joke", val: "What do you call a cat on Christmas? Santa Claws 😼🎅" },
      14: { tag: "Fact", val: "In Canada, Santa’s postal code is H0H 0H0 📨🎅" },
      15: { tag: "Gift", val: "A virtual spa day — relax and enjoy 🧖‍♀️💆" },
      16: { tag: "Aesthetic", val: "Gold table decor + greenery = dream dinner 🌿✨" },
      17: { tag: "Quote", val: "“A merry heart is a continual feast.” 💫" },
      18: { tag: "Joke", val: "What does Santa use to keep his suit wrinkle free? Santa-tizer 🤣" },
      19: { tag: "Fact", val: "Rudolph was invented in 1939 — now Christmas royalty 🦌" },
      20: { tag: "Gift", val: "A glam Christmas outfit that fits like magic 👗💄" },
      21: { tag: "Aesthetic", val: "Mirror fairy lights + soft glam night ✨🪞" },
      22: { tag: "Quote", val: "“The real magic of Christmas is family & friends.” 🤍" },
      23: { tag: "Joke", val: "What do elves learn at school? The elf-abet 🔤🧝‍♂️" },
      24: { tag: "Fact", val: "In many countries, Christmas Eve is the BIG celebration night 🌟" },
      25: { tag: "Gift", val: "A magical Christmas hug ✨🎁" }
    };

    const backdrop = document.getElementById("modal-backdrop");
    const tag = document.getElementById("tag");
    const content = document.getElementById("content");

    document.querySelectorAll(".day-btn").forEach((btn) =>
      btn.addEventListener("click", () => {
        const d = btn.dataset.day;
        tag.textContent = data[d].tag;
        content.textContent = data[d].val;
        backdrop.classList.add("active");
        btn.classList.add("opened");
      })
    );

    document.getElementById("close-modal").onclick = () =>
      backdrop.classList.remove("active");
  </script>
</body>
</html>
